<!DOCTYPE html>
<html lang="id" class="h-full bg-pink-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PastryFity Enterprise ERP V7</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f472b6; }
        .sidebar-min { width: 5rem !important; }
        .sidebar-min .hide-min { display: none !important; }
        .sidebar-min .justify-between { justify-content: center !important; }
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .bar { transition: height 0.5s ease-in-out; }
        .tab-btn.active { background-color: #be123c; color: white; border-color: #be123c; } /* rose-700 */
    </style>
</head>
<body class="h-full flex overflow-hidden text-slate-800 antialiased">

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center bg-rose-950">
        <div class="bg-white rounded-xl p-10 max-w-sm w-full shadow-2xl text-center space-y-6">
            <div class="mb-6">
                <img src="logo.jpeg" alt="Logo Pastryfity" class="w-24 h-24 mx-auto object-cover rounded-2xl shadow-md mb-4" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2Y0NzJiNiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSI0MCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIj5QPC90ZXh0Pjwvc3ZnPg=='">
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">Selamat Datang di Sistem Pastryfity</h1>
                <p class="text-[10px] font-bold text-pink-500 uppercase tracking-widest mt-2">Enterprise System</p>
            </div>
            <div class="space-y-4 text-left">
                <label class="block text-xs font-bold text-slate-600">Secure PIN Akses</label>
                <input type="password" id="login-pin" maxlength="6" placeholder="••••••" class="w-full bg-pink-50 border border-pink-200 rounded-lg px-4 py-4 text-center text-3xl font-black tracking-widest text-slate-800 focus:ring-2 focus:ring-pink-400 outline-none transition-all">
                <button onclick="login()" class="w-full py-3.5 bg-pink-500 text-white font-bold text-sm rounded-lg hover:bg-pink-600 transition-all shadow-md">Autentikasi Sistem</button>
            </div>
            <div class="text-[10px] text-slate-400 pt-4">PIN Default Owner: <strong>8888</strong></div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-view" class="flex w-full h-full hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-rose-950 text-slate-300 flex flex-col justify-between flex-shrink-0 transition-all duration-300 shadow-xl z-20">
            <div class="flex flex-col h-full">
                <div class="h-16 flex items-center justify-between px-6 border-b border-rose-900">
                    <div class="flex items-center gap-3 hide-min">
                        <img src="logo.jpeg" alt="Logo" class="w-8 h-8 rounded-lg object-cover shadow-sm" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                        <div class="w-8 h-8 bg-pink-500 rounded-md hidden items-center justify-center font-bold text-white shadow-sm">P</div>
                        <span class="font-bold text-white tracking-wide">PastryFity</span>
                    </div>
                    <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                </div>
                <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scroll" id="nav-container"></div>
                <div class="p-4 border-t border-rose-900 hide-min">
                    <div class="bg-rose-900 rounded-lg p-3 flex items-center gap-3 cursor-pointer hover:bg-rose-800 transition-all" onclick="openProfileModal()">
                        <div class="w-10 h-10 rounded-full bg-pink-600 flex items-center justify-center text-white font-bold" id="sidebar-avatar">U</div>
                        <div class="flex-1 overflow-hidden">
                            <p class="text-xs font-bold text-white truncate" id="sidebar-user-name">User Name</p>
                            <p class="text-[10px] text-pink-300 truncate" id="sidebar-user-role">Role</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-pink-50/30 relative">
            
            <!-- HEADER -->
            <header class="h-16 bg-white border-b border-pink-100 px-8 flex items-center justify-between flex-shrink-0 z-10 shadow-sm">
                <div class="flex items-center gap-4">
                    <img src="logo.jpeg" alt="Logo" class="w-10 h-10 rounded-full border-2 border-pink-100 shadow-sm object-cover" onerror="this.style.display='none'">
                    <div>
                        <p class="text-[10px] font-bold text-pink-500 uppercase tracking-wider">Selamat Datang, <span id="header-user-name" class="text-slate-800"></span></p>
                        <h2 id="header-title" class="text-lg font-extrabold text-slate-800 tracking-tight leading-none">Dashboard</h2>
                    </div>
                </div>
                <div class="flex items-center gap-4" id="header-actions">
                    <!-- Filter Date Range Custom for Dashboard -->
                    <div class="hidden items-center gap-2 bg-pink-50 rounded-lg px-3 py-1.5 border border-pink-100" id="dash-date-filter">
                        <span class="text-[10px] font-bold text-pink-500">FILTER:</span>
                        <input type="date" id="g-start" onchange="syncApp()" class="bg-transparent text-[11px] font-bold text-slate-800 outline-none">
                        <span>-</span>
                        <input type="date" id="g-end" onchange="syncApp()" class="bg-transparent text-[11px] font-bold text-slate-800 outline-none">
                    </div>
                    <button onclick="syncApp()" class="bg-white border border-pink-200 text-pink-600 hover:bg-pink-50 p-2 rounded-lg transition-all shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8" id="main-workspace">
                <!-- TABS CONTENT INJECTED HERE -->
            </div>
        </main>
    </div>

    <!-- MODAL: PROFILE & ACCOUNT -->
    <div id="modal-profile" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-xl w-full max-w-md shadow-2xl overflow-hidden modal-enter">
            <div class="bg-rose-950 p-6 text-center">
                <div class="w-20 h-20 bg-pink-500 rounded-full mx-auto border-4 border-rose-900 flex items-center justify-center text-3xl text-white font-bold mb-3" id="modal-avatar">U</div>
                <h3 class="text-lg font-bold text-white" id="modal-profile-name">Name</h3>
                <p class="text-xs text-pink-300" id="modal-profile-role">Role</p>
            </div>
            <div class="p-6 space-y-4">
                <form id="form-profile" onsubmit="updateProfile(event)" class="space-y-3">
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Lengkap</label><input type="text" id="prof-nama" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Kontak</label><input type="text" id="prof-kontak" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                    <div class="flex gap-2">
                        <button type="submit" class="w-full py-2 bg-pink-500 text-white text-[10px] font-bold rounded-lg hover:bg-pink-600">Simpan Profil</button>
                    </div>
                </form>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between">
                <button onclick="closeProfileModal()" class="text-xs font-bold text-slate-500">Tutup</button>
                <button onclick="logout()" class="text-xs font-bold text-rose-600">Keluar Sistem (Logout)</button>
            </div>
        </div>
    </div>

    <!-- MODAL: POS CUSTOM ITEM -->
    <div id="modal-pos-custom" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-xl w-full max-w-sm shadow-2xl overflow-hidden modal-enter p-6">
            <h3 class="text-sm font-bold text-slate-800 uppercase mb-4 border-b border-pink-100 pb-2">Tambah Custom Cake / Menu</h3>
            <form id="form-pos-custom" onsubmit="submitPosCustom(event)" class="space-y-3">
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Produk Custom</label><input type="text" id="pc-nama" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Detail / Request Tulisan</label><input type="text" id="pc-detail" placeholder="Cth: HBD Budi, warna biru" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-500"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Harga Satuan (Rp)</label><input type="number" id="pc-harga" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-500"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Jumlah (Qty)</label><input type="number" id="pc-qty" value="1" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-500"></div>
                </div>
                <div class="flex gap-2 pt-3">
                    <button type="button" onclick="document.getElementById('modal-pos-custom').classList.add('hidden')" class="w-1/2 py-2 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg hover:bg-slate-200">Batal</button>
                    <button type="submit" class="w-1/2 py-2 bg-pink-500 text-white text-xs font-bold rounded-lg hover:bg-pink-600">Masukan Keranjang</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ================= DATABASE ENGINE =================
        let db;
        let currentUser = null;
        let currentTab = '';
        let posCart = [];
        
        const MODULES = {
            'dashboard': { icon: '📊', label: 'Executive Dashboard', render: renderDashboard },
            'pos': { icon: '🛍️', label: 'Terminal POS & Kasir', render: renderPOS },
            'dapur': { icon: '👩‍🍳', label: 'Produksi & KOT Dapur', render: renderDapur },
            'stok': { icon: '📦', label: 'Master Stok & Inventaris', render: renderStok },
            'akuntansi': { icon: '🏦', label: 'Akuntansi & HPP', render: renderAkuntansi },
            'invoice': { icon: '🧾', label: 'Invoice Profesional', render: renderInvoice },
            'crm': { icon: '👥', label: 'CRM & Pelanggan', render: renderCRM },
            'hrm': { icon: '📋', label: 'HRM & Pengajuan', render: renderHRM },
            'kpi': { icon: '⭐', label: 'KPI & Payroll', render: renderKPI },
            'legal': { icon: '📜', label: 'Legal Dokumen', render: renderLegal },
            'master': { icon: '⚙️', label: 'Master Control & Admin', render: renderMaster }
        };

        const DEFAULT_ROLES = {
            'Super Admin': Object.keys(MODULES),
            'Owner': ['dashboard', 'pos', 'stok', 'akuntansi', 'invoice', 'crm', 'hrm', 'kpi', 'legal', 'master'],
            'Kasir': ['pos', 'invoice', 'crm', 'hrm'],
            'Baker': ['dapur', 'stok', 'hrm'],
            'Finance': ['akuntansi', 'invoice', 'kpi', 'hrm'],
            'Supervisor': ['dashboard', 'pos', 'stok', 'crm', 'hrm', 'kpi']
        };

        document.addEventListener('DOMContentLoaded', () => {
            let today = new Date();
            let firstDay = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
            let lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
            document.getElementById('g-start').value = firstDay;
            document.getElementById('g-end').value = lastDay;
            initDB();
        });

        function initDB() {
            const req = indexedDB.open('PastryFity_Ent_V7', 2);
            req.onupgradeneeded = (e) => {
                const u = e.target.result;
                if(!u.objectStoreNames.contains('users')) u.createObjectStore('users', { keyPath: 'pin' });
                if(!u.objectStoreNames.contains('roles')) u.createObjectStore('roles', { keyPath: 'name' });
                if(!u.objectStoreNames.contains('produk')) u.createObjectStore('produk', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('trx')) u.createObjectStore('trx', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('jurnal')) u.createObjectStore('jurnal', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('crm')) u.createObjectStore('crm', { keyPath: 'hp' });
                if(!u.objectStoreNames.contains('hrm')) u.createObjectStore('hrm', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('pengajuan')) u.createObjectStore('pengajuan', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('logs')) u.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('stok_log')) u.createObjectStore('stok_log', { keyPath: 'id', autoIncrement: true });
                if(!u.objectStoreNames.contains('kpi')) u.createObjectStore('kpi', { keyPath: 'nama' });
            };
            req.onsuccess = (e) => {
                db = e.target.result;
                seedInitialData();
            };
        }

        function seedInitialData() {
            const tx = db.transaction(['users', 'roles'], 'readwrite');
            const storeRoles = tx.objectStore('roles');
            for(let r in DEFAULT_ROLES) {
                storeRoles.get(r).onsuccess = e => { if(!e.target.result) storeRoles.put({name: r, modules: DEFAULT_ROLES[r]}); }
            }
            const storeUsers = tx.objectStore('users');
            storeUsers.get('8888').onsuccess = e => {
                if(!e.target.result) storeUsers.put({ pin: '8888', nama: 'Owner System', role: 'Super Admin', kontak: 'owner@pastryfity.com' });
            }
            tx.oncomplete = () => console.log("DB Ready.");
        }

        function logActivity(action, detail) {
            if(!currentUser) return;
            db.transaction('logs','readwrite').objectStore('logs').put({ user: currentUser.nama, pin: currentUser.pin, action, detail, ts: new Date().getTime() });
        }
        function logStokMove(nama, qty, ket) {
            db.transaction('stok_log','readwrite').objectStore('stok_log').put({ tgl: new Date().toISOString().split('T')[0], nama, qty, ket, ts: new Date().getTime() });
        }

        function login() {
            const pin = document.getElementById('login-pin').value;
            db.transaction(['users', 'roles'],'readonly').objectStore('users').get(pin).onsuccess = e => {
                if(e.target.result) {
                    currentUser = e.target.result;
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    document.getElementById('sidebar-user-name').innerText = currentUser.nama;
                    document.getElementById('sidebar-user-role').innerText = currentUser.role;
                    document.getElementById('sidebar-avatar').innerText = currentUser.nama.charAt(0).toUpperCase();
                    document.getElementById('header-user-name').innerText = currentUser.nama;
                    logActivity('Login', 'Masuk ke sistem');
                    buildNavigation();
                } else alert('PIN tidak terdaftar atau salah.');
            };
        }

        function logout() { logActivity('Logout', 'Keluar'); setTimeout(()=>location.reload(), 300); }

        function buildNavigation() {
            db.transaction('roles','readonly').objectStore('roles').get(currentUser.role).onsuccess = e => {
                const r = e.target.result; const mods = r ? r.modules : DEFAULT_ROLES['Super Admin'];
                const nav = document.getElementById('nav-container'); nav.innerHTML = '';
                mods.forEach(m => {
                    if(MODULES[m]) {
                        nav.innerHTML += `<button onclick="navigate('${m}')" id="nav-btn-${m}" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-slate-400 hover:bg-rose-900 hover:text-pink-100 transition-all"><span class="text-base">${MODULES[m].icon}</span><span class="hide-min">${MODULES[m].label}</span></button>`;
                    }
                });
                if(mods.length > 0) navigate(mods[0]);
            };
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-min'); }

        function navigate(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('bg-pink-500', 'text-white'); b.classList.add('text-slate-400'); });
            const activeBtn = document.getElementById(`nav-btn-${tab}`);
            if(activeBtn) { activeBtn.classList.remove('text-slate-400'); activeBtn.classList.add('bg-pink-500', 'text-white'); }
            currentTab = tab;
            document.getElementById('header-title').innerText = MODULES[tab].label;
            
            // Show/Hide Global Date Filter based on tab
            const df = document.getElementById('dash-date-filter');
            if(['dashboard','stok','akuntansi'].includes(tab)) { df.classList.remove('hidden'); df.classList.add('flex'); } 
            else { df.classList.add('hidden'); df.classList.remove('flex'); }

            MODULES[tab].render();
        }

        function syncApp() { if(currentTab && MODULES[currentTab]) MODULES[currentTab].render(); }

        function openProfileModal() { document.getElementById('modal-profile').classList.remove('hidden'); document.getElementById('prof-nama').value = currentUser.nama; }
        function closeProfileModal() { document.getElementById('modal-profile').classList.add('hidden'); }
        function updateProfile(e) {
            e.preventDefault(); currentUser.nama = document.getElementById('prof-nama').value; currentUser.kontak = document.getElementById('prof-kontak').value;
            db.transaction('users','readwrite').objectStore('users').put(currentUser).onsuccess = () => {
                document.getElementById('sidebar-user-name').innerText = currentUser.nama; document.getElementById('header-user-name').innerText = currentUser.nama;
                alert('Profil tersimpan.'); closeProfileModal();
            };
        }

        function toRp(num) { return 'Rp ' + (num||0).toLocaleString('id-ID'); }
        function createTable(headers, rowsHtml, actionsHtml = '') {
            return `<div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col">${actionsHtml ? `<div class="p-3 border-b border-pink-100 bg-pink-50/50 flex gap-2 overflow-x-auto">${actionsHtml}</div>` : ''}<div class="overflow-x-auto"><table class="w-full text-left text-xs whitespace-nowrap"><thead class="bg-pink-50 text-pink-600 font-bold uppercase tracking-wider"><tr>${headers.map(h=>`<th class="px-4 py-3">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 text-slate-700 font-medium">${rowsHtml}</tbody></table></div></div>`;
        }

        // ==========================================
        // MODULE: DASHBOARD EXECUTIVE (CHARTS & FILTERS)
        // ==========================================
        function renderDashboard() {
            const ws = document.getElementById('main-workspace');
            ws.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="dash-cards"></div>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    <div class="bg-white border border-pink-100 rounded-xl p-5 shadow-sm flex flex-col">
                        <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 border-b border-pink-50 pb-2">Pemasukan vs Pengeluaran Jurnal</h3>
                        <div class="h-48 flex items-end gap-4 border-b border-l border-slate-200 p-2 relative" id="chart-finance"></div>
                        <div class="flex justify-center gap-4 mt-3 text-[10px] font-bold"><span class="text-emerald-500">■ Uang Masuk</span><span class="text-rose-500">■ Uang Keluar</span></div>
                    </div>
                    <div class="bg-white border border-pink-100 rounded-xl p-5 shadow-sm flex flex-col">
                        <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 border-b border-pink-50 pb-2">Pembagian Kas Lunas vs DP</h3>
                        <div class="h-48 flex items-end gap-4 border-b border-l border-slate-200 p-2 relative" id="chart-dp"></div>
                        <div class="flex justify-center gap-4 mt-3 text-[10px] font-bold"><span class="text-indigo-500">■ Lunas</span><span class="text-amber-500">■ DP Kas</span></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white border border-pink-100 rounded-xl p-5 shadow-sm">
                        <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 border-b border-pink-50 pb-2">Produk Keluar (POS)</h3>
                        <div class="h-48 flex items-end gap-2 border-b border-l border-slate-200 p-2" id="chart-sales"></div>
                    </div>
                    <div class="bg-white border border-pink-100 rounded-xl p-5 shadow-sm">
                        <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 border-b border-pink-50 pb-2">Produksi Dapur (Masuk Displei)</h3>
                        <div class="h-48 flex items-end gap-2 border-b border-l border-slate-200 p-2" id="chart-produksi"></div>
                    </div>
                </div>
            `;
            
            let start = document.getElementById('g-start').value;
            let end = document.getElementById('g-end').value;

            let o=0, p=0, d=0;
            let totalLunas = 0, totalDP = 0;
            const chartDataSales = {};
            const chartDataProd = {};
            let inc=0, exp=0;

            // 1. Hitung TRX (Produk Keluar, DP, Lunas)
            db.transaction('trx','readonly').objectStore('trx').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let v = c.value;
                    if(v.tgl >= start && v.tgl <= end) {
                        o += v.net; p += v.sisa; d += v.dp;
                        if(v.stat === 'Lunas') totalLunas += v.net;
                        if(v.stat === 'DP') totalDP += v.dp;
                        
                        let day = v.tgl.split('-')[2];
                        chartDataSales[day] = (chartDataSales[day]||0) + v.net;
                    }
                    c.continue();
                } else {
                    document.getElementById('dash-cards').innerHTML = `
                        <div class="bg-white border border-pink-100 p-5 rounded-xl shadow-sm"><p class="text-[10px] font-bold text-slate-400 uppercase">Total Nilai Order</p><p class="text-2xl font-black text-slate-800 mt-1">${toRp(o)}</p></div>

                        <div class="bg-white border border-pink-100 p-5 rounded-xl shadow-sm"><p class="text-[10px] font-bold text-slate-400 uppercase">Piutang / Sisa DP</p><p class="text-2xl font-black text-amber-500 mt-1">${toRp(p)}</p></div>

                    `;

                    // Chart Sales
                    const cDiv = document.getElementById('chart-sales');
                    let maxVal = Math.max(...Object.values(chartDataSales), 1);
                    for(let i=1; i<=31; i++) {
                        let day = i<10?'0'+i:''+i; let val = chartDataSales[day]||0; let h = (val/maxVal)*100;
                        if(val>0) cDiv.innerHTML += `<div class="w-full bg-pink-400 rounded-t-sm bar relative group hover:bg-pink-600" style="height:${h}%"><span class="absolute -top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[8px] px-1 rounded opacity-0 group-hover:opacity-100">${toRp(val)}</span></div>`;
                    }

                    // Chart Lunas vs DP
                    let maxKas = Math.max(totalLunas, totalDP, 1);
                    document.getElementById('chart-dp').innerHTML = `
                        <div class="w-1/2 bg-indigo-500 rounded-t-md bar relative group flex justify-center" style="height:${(totalLunas/maxKas)*100}%"><span class="absolute -top-6 bg-slate-800 text-white text-[9px] px-2 py-0.5 rounded font-bold">${toRp(totalLunas)}</span></div>
                        <div class="w-1/2 bg-amber-400 rounded-t-md bar relative group flex justify-center" style="height:${(totalDP/maxKas)*100}%"><span class="absolute -top-6 bg-slate-800 text-white text-[9px] px-2 py-0.5 rounded font-bold">${toRp(totalDP)}</span></div>
                    `;
                }
            };

            // 2. Hitung Jurnal (Finance Masuk vs Keluar)
            db.transaction('jurnal','readonly').objectStore('jurnal').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let j = c.value;
                    if(j.tgl >= start && j.tgl <= end) {
                        if(j.jenis.includes('(+)') || j.jenis.includes('Pendapatan')) inc+=j.nom;
                        else exp+=j.nom;
                    }
                    c.continue();
                } else {
                    let maxFin = Math.max(inc, exp, 1);
                    document.getElementById('chart-finance').innerHTML = `
                        <div class="w-1/2 bg-emerald-500 rounded-t-md bar relative group flex justify-center" style="height:${(inc/maxFin)*100}%"><span class="absolute -top-6 bg-slate-800 text-white text-[9px] px-2 py-0.5 rounded font-bold">${toRp(inc)}</span></div>
                        <div class="w-1/2 bg-rose-500 rounded-t-md bar relative group flex justify-center" style="height:${(exp/maxFin)*100}%"><span class="absolute -top-6 bg-slate-800 text-white text-[9px] px-2 py-0.5 rounded font-bold">${toRp(exp)}</span></div>
                    `;
                }
            };

            // 3. Hitung Produksi (Stok Masuk)
            db.transaction('stok_log','readonly').objectStore('stok_log').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let s = c.value;
                    if(s.tgl >= start && s.tgl <= end && s.ket.includes('Produksi')) {
                        let day = s.tgl.split('-')[2];
                        chartDataProd[day] = (chartDataProd[day]||0) + s.qty;
                    }
                    c.continue();
                } else {
                    const cDiv = document.getElementById('chart-produksi');
                    let maxVal = Math.max(...Object.values(chartDataProd), 1);
                    for(let i=1; i<=31; i++) {
                        let day = i<10?'0'+i:''+i; let val = chartDataProd[day]||0; let h = (val/maxVal)*100;
                        if(val>0) cDiv.innerHTML += `<div class="w-full bg-emerald-400 rounded-t-sm bar relative group hover:bg-emerald-600" style="height:${h}%"><span class="absolute -top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[8px] px-1 rounded opacity-0 group-hover:opacity-100">${val} Pcs</span></div>`;
                    }
                }
            };
        }

        function submitPosCustom(e) {
            e.preventDefault();
            let n = document.getElementById('pc-nama').value;
            let d = document.getElementById('pc-detail').value;
            let h = parseFloat(document.getElementById('pc-harga').value)||0;
            let q = parseInt(document.getElementById('pc-qty').value)||1;
            posCart.push({id:'custom', nama: `[Custom] ${n} ${d?"- "+d:""}`, harga: h, qty:q, max:999});

        function addPosCart(id, nama, harga, max) {
            let ex = posCart.find(i=>i.id===id);
            if(ex) { if(ex.qty+1 > max) return alert('Stok fisik tidak mencukupi.'); ex.qty++; }
            else { posCart.push({id, nama, harga, qty:1, max}); }
            renderPosCart();
        }
        function updPosQty(idx, val) {
            let q = parseInt(val)||1;
            if(posCart[idx].id !== 'custom' && q > posCart[idx].max) return alert('Melebihi stok gudang!');
            posCart[idx].qty = q; renderPosCart();
        }
        function delPosCart(idx) { posCart.splice(idx,1); renderPosCart(); }

        function renderPosCart() {
            let l = document.getElementById('pos-cart-list'); l.innerHTML = '';
            posCart.forEach((i,x) => {
                l.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-pink-50 last:border-0">
                        <div class="flex-1 pr-2 overflow-hidden"><h4 class="text-[11px] font-bold text-slate-800 truncate">${i.nama}</h4><p class="text-[9px] text-slate-500">${toRp(i.harga)}</p></div>
                        <div class="flex items-center gap-2">
                            <input type="number" value="${i.qty}" onchange="updPosQty(${x}, this.value)" class="w-10 border border-pink-200 rounded text-center text-xs py-1 outline-none">
                            <div class="w-16 text-right text-[11px] font-black text-slate-800">${toRp(i.harga*i.qty)}</div>
                            <button onclick="delPosCart(${x})" class="text-rose-500 bg-rose-50 hover:bg-rose-100 px-1.5 py-0.5 rounded font-bold">X</button>
                        </div>
                    </div>
                `;
            });
            calcPosSum();
        }

        function togglePosDp() {
            let v = document.getElementById('pos-status').value;
            let c = document.getElementById('pos-dp-container');
            let sr = document.getElementById('pos-sum-sisa-row');
            if(v==='DP') { c.classList.remove('hidden'); sr.classList.remove('hidden'); document.getElementById('pos-dp-nom').focus(); }
            else { c.classList.add('hidden'); sr.classList.add('hidden'); document.getElementById('pos-dp-nom').value=''; }
            calcPosSum();
        }

        function calcPosSum() {
            let packOpt = document.getElementById('pos-pack').value;
            let packCost = packOpt.includes('Paper Bag') ? 5000 : 0;
            
            let sub = posCart.reduce((a,c)=>a+(c.harga*c.qty),0) + packCost;
            let ppn = sub * 0.11;
            let net = sub + ppn;

            document.getElementById('pos-sum-sub').innerText = toRp(sub);
            document.getElementById('pos-sum-ppn').innerText = toRp(ppn);
            document.getElementById('pos-sum-net').innerText = toRp(net);

            let stat = document.getElementById('pos-status').value;
            let dp = parseFloat(document.getElementById('pos-dp-nom')?.value) || 0;
            let sisa = stat==='DP' ? net-dp : 0;
            if(document.getElementById('pos-sum-sisa')) document.getElementById('pos-sum-sisa').innerText = toRp(sisa);

            return {sub, ppn, net, stat, dp:(stat==='DP'?dp:net), sisa, pack:packOpt};
        }

        function checkoutPos() {
            if(posCart.length===0) return alert('Keranjang Kosong!');
            let hp = document.getElementById('pos-hp').value || '-';
            let nm = document.getElementById('pos-nama').value || 'Guest';
            let d = calcPosSum();
            if(d.stat==='DP' && d.dp<=0) return alert('Input nominal DP!');

            let tglOrd = document.getElementById('pos-tgl').value;
            let jamOrd = document.getElementById('pos-jam').value;
            let tglAmb = document.getElementById('pos-tgl-ambil').value;
            let jamAmb = document.getElementById('pos-jam-ambil').value;

            let trx = {
                tgl: tglOrd, jam: jamOrd, tglAmbil: tglAmb, jamAmbil: jamAmb,
                cust: nm, hp, items: posCart, sub: d.sub, ppn: d.ppn, net: d.net, dp: d.dp, sisa: d.sisa, 
                stat: d.stat, method: document.getElementById('pos-method').value, 
                kirim: document.getElementById('pos-kirim').value, pack: d.pack,
                kasir: currentUser.nama, ts: new Date().getTime()
            };

            let t = db.transaction(['trx','jurnal','produk','crm', 'stok_log'], 'readwrite');
            t.objectStore('trx').put(trx);

            if(d.dp>0) {
                t.objectStore('jurnal').put({ tgl: trx.tgl, jenis: 'Pendapatan Operasional (+)', nom: d.dp, ket: `POS ${d.stat} [${trx.method}] - ${nm}`});
                if(d.ppn>0) t.objectStore('jurnal').put({ tgl: trx.tgl, jenis: 'Hutang Usaha (+)', nom: d.ppn, ket: `PPN Keluaran dari ${nm}`});
            }

            let sp = t.objectStore('produk');
            let sl = t.objectStore('stok_log');
            posCart.forEach(i => {
                if(i.id!=='custom') {
                    sp.get(i.id).onsuccess = e => {
                        let p = e.target.result; 
                        if(p) { 
                            p.stok -= i.qty; sp.put(p); 
                            sl.put({ tgl: trx.tgl, nama: p.nama, qty: -i.qty, ket: 'Penjualan Kasir POS', ts: new Date().getTime()});
                        }
                    };
                }
            });

            if(hp!=='-') {
                let sc = t.objectStore('crm');
                sc.get(hp).onsuccess = e => { let c = e.target.result || {hp, nama:nm, total:0, poin:0}; c.total += d.net; c.poin += 10; sc.put(c); };
            }

            t.oncomplete = () => {
                logActivity('Transaksi POS', `Order ${nm} - ${toRp(d.net)}`);
                alert('Transaksi Berhasil Tersimpan.');
                posCart = []; renderPosCart(); renderPosGrid();
            };
        }

        function submitProduksiDapur(e) {
            e.preventDefault();

        function renderStokList() {
            let start = document.getElementById('g-start').value;
            let end = document.getElementById('g-end').value;
            let rows = [];
            
            if(stokTab === 'log') {
                db.transaction('stok_log','readonly').objectStore('stok_log').openCursor(null, 'prev').onsuccess = e => {
                    let c = e.target.result;
                    if(c) {
                        let l = c.value;
                        if(l.tgl >= start && l.tgl <= end) {
                            rows.push(`<tr><td class="px-4 py-2">${l.tgl}</td><td class="px-4 py-2 font-bold">${l.nama}</td><td class="px-4 py-2 font-black ${l.qty>0?'text-emerald-500':'text-rose-500'}">${l.qty>0?'+'+l.qty:l.qty}</td><td class="px-4 py-2">${l.ket}</td></tr>`);
                        }
                        c.continue();
                    } else {
                        document.getElementById('stok-view-container').innerHTML = createTable(['Tanggal', 'Nama Barang', 'Qty Mutasi', 'Keterangan'], rows.join(''));
                    }
                }
                return;
            }

            db.transaction('produk','readonly').objectStore('produk').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let p = c.value;
                    let action = `<button onclick="db.transaction('produk','readwrite').objectStore('produk').delete(${p.id}).onsuccess=()=>renderStokList()" class="text-rose-500 hover:underline">Hapus</button>`;
                    
                    if(stokTab === 'bahan' && p.tipe !== 'Inventaris') {
                        let cCol = p.tipe==='Barang Displei'?'text-pink-600':'text-amber-600';
                        rows.push(`<tr><td class="px-4 py-3"><span class="font-bold block">${p.nama}</span><span class="text-[9px] text-slate-400">${p.tipe}</span></td><td class="px-4 py-3 font-black ${cCol}">${p.stok} ${p.bom}</td><td class="px-4 py-3">${toRp(p.modal)}</td><td class="px-4 py-3">${toRp(p.jual)}</td><td class="px-4 py-3 text-center">${action}</td></tr>`);
                    } else if (stokTab === 'inven' && p.tipe === 'Inventaris') {
                        rows.push(`<tr><td class="px-4 py-3 font-bold">${p.nama}</td><td class="px-4 py-3 font-black text-slate-600">${p.stok} Unit</td><td class="px-4 py-3">${toRp(p.modal)}</td><td class="px-4 py-3 text-center">${action}</td></tr>`);
                    }
                    c.continue();
                } else {
                    if(stokTab === 'bahan') document.getElementById('stok-view-container').innerHTML = createTable(['Nama Item', 'Stok Gudang', 'Harga Modal (HPP)', 'Harga Jual', 'Aksi'], rows.join(''));
                    else document.getElementById('stok-view-container').innerHTML = createTable(['Nama Aset/Mesin', 'Jumlah Unit', 'Nilai Aset', 'Aksi'], rows.join(''));
                }
            }
        }

        function saveStok(e) {
            e.preventDefault();
            let pData = {
                nama: document.getElementById('ms-nama').value, tipe: document.getElementById('ms-tipe').value, kat: document.getElementById('ms-kat').value,
                stok: parseInt(document.getElementById('ms-stok').value)||0, jual: parseFloat(document.getElementById('ms-jual').value)||0, modal: parseFloat(document.getElementById('ms-modal').value)||0, bom: document.getElementById('ms-bom').value
            };
            let t = db.transaction(['produk', 'stok_log'],'readwrite');
            t.objectStore('produk').put(pData);
            t.objectStore('stok_log').put({ tgl: new Date().toISOString().split('T')[0], nama: pData.nama, qty: pData.stok, ket: 'Stok Awal Sistem', ts: new Date().getTime()});
            t.oncomplete = () => { document.getElementById('form-add-stok').reset(); renderStokList(); };
        }

        // ==========================================
        // MODULE: AKUNTANSI, JURNAL, & HPP
        // ==========================================
        let actReportTab = 'lr';
        function renderAkuntansi() {
            const ws = document.getElementById('main-workspace');
            ws.innerHTML = `
                <div class="space-y-6">

                                        <option value="Modal Ekuitas (+)">Modal Ekuitas Masuk (+)</option><option value="Prive (-)">Prive / Penarikan Owner (-)</option>
                                        <option value="Beban Operasional (-)">Beban Operasional (Listrik, Sewa) (-)</option><option value="Beban Bahan Baku (-)">Beban Pembelian Bahan Baku (-)</option>
                                        <option value="Pembelian Aset Tetap (-)">Pembelian Aset Tetap (Mesin) (-)</option><option value="Hutang Usaha (+)">Penerimaan Hutang Usaha (+)</option>
                                    </select>
                                </div>
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nominal (Rp)</label><input type="number" id="act-nom" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium outline-none focus:border-pink-400"></div>
                                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Keterangan</label><input type="text" id="act-ket" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium outline-none focus:border-pink-400"></div>

                        </div>
                        
                        <div class="bg-white border border-pink-100 rounded-xl shadow-sm lg:col-span-2 flex flex-col overflow-hidden">
                            <div class="p-3 border-b border-pink-100 bg-pink-50/50 flex gap-1 overflow-x-auto scrollbar-hide">
                                <button onclick="swActTab('lr')" class="act-tab px-3 py-1.5 text-[10px] font-bold rounded-md whitespace-nowrap transition-all ${actReportTab==='lr'?'bg-rose-950 text-white':'text-slate-500 hover:bg-pink-100'}">Laba Rugi</button>
                                <button onclick="swActTab('neraca')" class="act-tab px-3 py-1.5 text-[10px] font-bold rounded-md whitespace-nowrap transition-all ${actReportTab==='neraca'?'bg-rose-950 text-white':'text-slate-500 hover:bg-pink-100'}">Neraca (Balance Sheet)</button>
                                <button onclick="swActTab('bb')" class="act-tab px-3 py-1.5 text-[10px] font-bold rounded-md whitespace-nowrap transition-all ${actReportTab==='bb'?'bg-rose-950 text-white':'text-slate-500 hover:bg-pink-100'}">Buku Besar</button>
                                <button onclick="swActTab('hpp')" class="act-tab px-3 py-1.5 text-[10px] font-bold rounded-md whitespace-nowrap transition-all ${actReportTab==='hpp'?'bg-rose-950 text-white':'text-slate-500 hover:bg-pink-100'}">Dasbor HPP</button>
                            </div>
                            <div class="flex-1 p-4 overflow-y-auto" id="act-report-container"></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('act-tgl').value = new Date().toISOString().split('T')[0];
            generateReports();
        }

        function swActTab(t) { actReportTab = t; renderAkuntansi(); }

        function saveJurnalAct(e) {
            e.preventDefault();
            db.transaction('jurnal','readwrite').objectStore('jurnal').put({
                tgl: document.getElementById('act-tgl').value, jenis: document.getElementById('act-jenis').value, 
                nom: parseFloat(document.getElementById('act-nom').value)||0, ket: document.getElementById('act-ket').value
            }).onsuccess = () => { logActivity('Jurnal', 'Input Jurnal Manual'); document.getElementById('act-nom').value=''; document.getElementById('act-ket').value=''; generateReports(); }
        }

        function generateReports() {
            if(actReportTab === 'hpp') return renderHppDashboard();

            let start = document.getElementById('g-start').value;
            let end = document.getElementById('g-end').value;
            let inc=0, exp=0, modal=0, prive=0, asetTetap=0, hutang=0;
            let rowsBB = [];

            db.transaction('jurnal','readonly').objectStore('jurnal').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let j = c.value;
                    if(j.tgl >= start && j.tgl <= end) {
                        rowsBB.push(`<tr><td class="p-2 border-b border-pink-50">${j.tgl}</td><td class="p-2 border-b border-pink-50 font-bold">${j.jenis}</td><td class="p-2 border-b border-pink-50">${j.ket}</td><td class="p-2 border-b border-pink-50">${toRp(j.nom)}</td></tr>`);
                        
                        if(j.jenis.includes('(+)') || j.jenis.includes('Pendapatan')) inc+=j.nom;
                        if(j.jenis.includes('(-)') || j.jenis.includes('Beban') || j.jenis.includes('Pajak')) exp+=j.nom;
                        
                        if(j.jenis.includes('Modal Ekuitas')) modal+=j.nom;
                        if(j.jenis.includes('Prive')) prive+=j.nom;
                        if(j.jenis.includes('Aset Tetap')) asetTetap+=j.nom;
                        if(j.jenis.includes('Hutang')) hutang+=j.nom;
                    }
                    c.continue();
                } else {
                    let laba = inc - exp;
                    let cont = document.getElementById('act-report-container');
                    let t = `<table class="w-full text-xs text-left">`;
                    
                    if(actReportTab === 'lr') {
                        cont.innerHTML = t + `
                            <tr><td class="p-3 font-bold bg-pink-50/50" colspan="2">PENDAPATAN OPERASIONAL</td></tr>
                            <tr><td class="p-3 pl-6 border-b border-pink-50">Total Pemasukan (POS & Hutang Dibayar)</td><td class="p-3 border-b border-pink-50 font-medium">${toRp(inc)}</td></tr>
                            <tr><td class="p-3 font-bold bg-pink-50/50 text-rose-600" colspan="2">BEBAN & BIAYA</td></tr>
                            <tr><td class="p-3 pl-6 border-b border-pink-50">Total Pengeluaran (Beban & Pajak)</td><td class="p-3 border-b border-pink-50 font-medium text-rose-500">(${toRp(exp)})</td></tr>
                            <tr><td class="p-3 font-black text-pink-700 bg-pink-50 border-t-2 border-pink-200">LABA BERSIH (NET INCOME)</td><td class="p-3 font-black text-pink-700 bg-pink-50 border-t-2 border-pink-200">${toRp(laba)}</td></tr>
                        </table>`;
                    } 
                    else if(actReportTab === 'neraca') {
                        let asetLancar = (modal + inc) - (exp + prive + asetTetap);
                        cont.innerHTML = t + `
                            <tr><td class="p-2 font-bold bg-pink-50/50" colspan="2">ASET (HARTA)</td></tr>
                            <tr><td class="p-2 pl-6 border-b border-pink-50">Aset Lancar (Kas/Bank)</td><td class="p-2 border-b border-pink-50">${toRp(asetLancar)}</td></tr>
                            <tr><td class="p-2 pl-6 border-b border-pink-50">Aset Tetap (Inventaris/Mesin)</td><td class="p-2 border-b border-pink-50">${toRp(asetTetap)}</td></tr>
                            <tr><td class="p-2 font-black bg-pink-100">TOTAL ASET</td><td class="p-2 font-black bg-pink-100">${toRp(asetLancar+asetTetap)}</td></tr>
                            <tr><td class="p-2 font-bold bg-pink-50/50 mt-4 block border-t" colspan="2">KEWAJIBAN & EKUITAS</td></tr>
                            <tr><td class="p-2 pl-6 border-b border-pink-50">Kewajiban Hutang</td><td class="p-2 border-b border-pink-50">${toRp(hutang)}</td></tr>
                            <tr><td class="p-2 pl-6 border-b border-pink-50">Ekuitas Akhir</td><td class="p-2 border-b border-pink-50">${toRp(modal+laba-prive)}</td></tr>
                            <tr><td class="p-2 font-black bg-pink-100">TOTAL KEWAJIBAN & EKUITAS</td><td class="p-2 font-black bg-pink-100">${toRp(hutang+(modal+laba-prive))}</td></tr>
                        </table>`;
                    }
                    else if(actReportTab === 'bb') {
                        cont.innerHTML = `<table class="w-full text-[10px] text-left"><thead class="bg-pink-50 text-pink-600 uppercase"><tr><th class="p-2">TGL</th><th class="p-2">AKUN/ALIRAN</th><th class="p-2">MEMO</th><th class="p-2">NILAI</th></tr></thead><tbody>${rowsBB.join('')}</tbody></table>`;
                    }
                }
            }
        }

        function renderHppDashboard() {
            let cont = document.getElementById('act-report-container');
            let hHTML = `<h3 class="text-xs font-bold text-slate-800 uppercase mb-3">Analisis HPP (Harga Pokok Penjualan) & Margin</h3><div class="space-y-2">`;
            
            db.transaction('produk','readonly').objectStore('produk').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let p = c.value;
                    if(p.tipe === 'Barang Displei' && p.jual > 0) {
                        let modal = parseFloat(p.modal)||0;
                        let margin = p.jual - modal;
                        let pMargin = modal>0 ? ((margin/p.jual)*100).toFixed(1) : 100;
                        hHTML += `
                            <div class="p-3 border border-pink-100 rounded-lg flex justify-between items-center bg-white">
                                <div><h4 class="text-xs font-bold">${p.nama}</h4><p class="text-[9px] text-slate-500">Harga Jual: ${toRp(p.jual)} | Harga Modal (HPP): ${toRp(modal)}</p></div>
                                <div class="text-right"><span class="block text-xs font-black text-emerald-500">Margin: ${toRp(margin)}</span><span class="text-[10px] font-bold text-pink-500">${pMargin}% Laba</span></div>
                            </div>
                        `;
                    }
                    c.continue();
                } else {
                    cont.innerHTML = hHTML + '</div><p class="text-[9px] text-slate-400 mt-4">*Untuk mengubah HPP, edit Harga Beli/Modal di Master Stok.</p>';
                }
            }
        }

        function saveAbsen(e) {
            e.preventDefault();
            db.transaction('hrm','readwrite').objectStore('hrm').put({ nama: currentUser.nama, tipe: document.getElementById('absen-tipe').value, ts: new Date().getTime() }).onsuccess = () => renderHRM();
        }
        function loadAbsen() {
            let tb = document.getElementById('table-absen-body'); tb.innerHTML='';
            db.transaction('hrm','readonly').objectStore('hrm').openCursor(null,'prev').onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let d = c.value; let color = d.tipe.includes('IN') ? 'text-emerald-500' : 'text-amber-500';
                    tb.innerHTML += `<tr><td class="p-2"><span class="block font-bold text-slate-800">${d.nama}</span><span class="text-[9px] text-slate-400">${new Date(d.ts).toLocaleString('id-ID')}</span></td><td class="p-2 font-black ${color}">${d.tipe}</td></tr>`; c.continue();
                }
            }
        }
        function savePengajuan(e) {
            e.preventDefault();
            db.transaction('pengajuan','readwrite').objectStore('pengajuan').put({ tgl: document.getElementById('aju-tgl').value, nama: currentUser.nama, tipe: document.getElementById('aju-tipe').value, ket: document.getElementById('aju-ket').value, ts: new Date().getTime()}).onsuccess = () => { alert('Pengajuan Berhasil Dikirim!'); document.getElementById('aju-ket').value=''; loadPengajuan(); };
        }
        function loadPengajuan() {
            let tb = document.getElementById('table-aju-body'); tb.innerHTML='';
            db.transaction('pengajuan','readonly').objectStore('pengajuan').openCursor(null,'prev').onsuccess = e => {

        // ==========================================
        // MODULE: KPI & PAYROLL (JURNAL AUTO)
        // ==========================================
        function renderKPI() {
            const ws = document.getElementById('main-workspace');
            ws.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <form onsubmit="saveKpi(event)" class="bg-white border border-pink-100 rounded-xl p-6 shadow-sm space-y-3 h-min md:col-span-1">
                        <h3 class="text-xs font-bold text-slate-800 uppercase mb-2 border-b border-pink-100 pb-2">Terbitkan Payroll Karyawan</h3>
                        <div><label class="block text-[10px] font-bold text-slate-500">Nama Staf</label><input type="text" id="kpi-nama" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <div><label class="block text-[10px] font-bold text-slate-500">Gaji Pokok (Rp)</label><input type="number" id="kpi-gaji" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <div><label class="block text-[10px] font-bold text-slate-500">Tunjangan / Lembur (Rp)</label><input type="number" id="kpi-tunjang" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <div><label class="block text-[10px] font-bold text-slate-500">Potongan / Kasbon (Rp)</label><input type="number" id="kpi-potong" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <button type="submit" class="w-full py-2.5 bg-pink-500 text-white text-xs font-bold rounded-lg shadow-sm hover:bg-pink-600">Simpan & Masukan Pengeluaran</button>
                    </form>
                    <div class="bg-white border border-pink-100 rounded-xl p-6 shadow-sm flex flex-col md:col-span-2 overflow-hidden">
                        <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 border-b border-pink-100 pb-2">Rekap Payroll Diterbitkan</h3>
                        <div class="flex-1 overflow-auto"><table class="w-full text-left text-xs"><thead class="bg-pink-50 text-pink-600"><tr><th class="p-2">Nama</th><th class="p-2">Gaji Pokok</th><th class="p-2">Tunjangan</th><th class="p-2 text-rose-500">Potongan</th><th class="p-2 text-emerald-500">THP (Terima)</th></tr></thead><tbody id="table-kpi-body" class="divide-y divide-pink-50"></tbody></table></div>
                    </div>
                </div>
            `;
            let tb = document.getElementById('table-kpi-body');
            db.transaction('kpi','readonly').objectStore('kpi').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    tb.innerHTML += `<tr><td class="p-2 font-bold text-slate-800">${c.value.nama}</td><td class="p-2">${toRp(c.value.base)}</td><td class="p-2">${toRp(c.value.tunjang)}</td><td class="p-2 text-rose-500">-${toRp(c.value.potong)}</td><td class="p-2 font-bold text-emerald-600">${toRp(c.value.thp)}</td></tr>`;
                    c.continue();
                }
            }
        }
        function saveKpi(e) {
            e.preventDefault();
            let nm = document.getElementById('kpi-nama').value;
            let base = parseFloat(document.getElementById('kpi-gaji').value)||0;
            let tunjang = parseFloat(document.getElementById('kpi-tunjang').value)||0;
            let potong = parseFloat(document.getElementById('kpi-potong').value)||0;
            let thp = base + tunjang - potong;

            let t = db.transaction(['kpi', 'jurnal'], 'readwrite');
            t.objectStore('kpi').put({nama: nm, base, tunjang, potong, thp});
            
            // Otomatis masuk Jurnal Pengeluaran
            t.objectStore('jurnal').put({
                tgl: new Date().toISOString().split('T')[0], jenis: 'Beban Operasional (-)', nom: thp, ket: `Beban Gaji Karyawan - ${nm}`
            });

            t.oncomplete = () => { alert('Payroll diterbitkan & masuk ke Jurnal Pengeluaran!'); renderKPI(); };
        }

        // ==========================================

        // ==========================================
        function renderInvoice() {
            const ws = document.getElementById('main-workspace');
            ws.innerHTML = `

                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6 border-b border-pink-100 pb-3">Buat Invoice B2B Profesional (PDF)</h3>
                    <form onsubmit="generateInvoice(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-[10px] font-bold text-slate-500 mb-1">No Invoice</label><input type="text" id="inv-no" value="INV-${new Date().getTime().toString().slice(-6)}" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold outline-none"></div>
                            <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Tanggal Tempo</label><input type="date" id="inv-tgl" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        </div>
                        <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Kepada (Perusahaan/Klien)</label><input type="text" id="inv-klien" required placeholder="PT. ABC Maju" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Deskripsi Item Pesanan (Pisahkan dgn Koma)</label><input type="text" id="inv-item" required placeholder="100x Hampers Nastar, 50x Kue Lapis..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Total Tagihan (Rp)</label><input type="number" id="inv-total" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none"></div>
                        <button type="submit" class="btn-ios w-full py-4 bg-emerald-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-emerald-700">Download PDF Invoice</button>
                    </form>

            `;
            document.getElementById('inv-tgl').value = new Date().toISOString().split('T')[0];
        }

        function generateInvoice(e) {
            e.preventDefault();
            const no = document.getElementById('inv-no').value;
            const tgl = document.getElementById('inv-tgl').value;
            const klien = document.getElementById('inv-klien').value;
            const items = document.getElementById('inv-item').value.split(',');
            const total = parseFloat(document.getElementById('inv-total').value);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ format: 'a4' });
            
            doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.text("INVOICE", 150, 20);
            doc.setFontSize(16); doc.text("PASTRYFITY ENTERPRISE", 20, 20);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10); 
            doc.text("Gedung PastryFity HQ, Jalan Merdeka No. 1, Kota Medan", 20, 26);
            
            doc.setLineWidth(0.5); doc.line(20, 32, 190, 32);

            doc.setFont("helvetica", "bold"); doc.text("Tagihan Kepada:", 20, 45); doc.setFont("helvetica", "normal");
            doc.text(klien, 20, 51);
            doc.text(`No. Invoice : ${no}`, 140, 45);
            doc.text(`Tgl Tempo   : ${tgl}`, 140, 51);

            // Table Header
            doc.setFillColor(240, 240, 240); doc.rect(20, 60, 170, 8, 'F');
            doc.setFont("helvetica", "bold");
            doc.text("Deskripsi Layanan / Produk", 25, 65);
            doc.text("Jumlah Tagihan", 150, 65);
            
            doc.setFont("helvetica", "normal");
            let y = 75;
            items.forEach(it => { doc.text(it.trim(), 25, y); y+=8; });

            doc.setLineWidth(0.5); doc.line(20, y, 190, y); y+=8;
            doc.setFont("helvetica", "bold"); doc.setFontSize(12);
            doc.text("TOTAL AMOUNT:", 100, y); doc.text(toRp(total), 150, y);

            doc.setFont("helvetica", "normal"); doc.setFontSize(10);
            doc.text("Metode Pembayaran:", 20, y+20);
            doc.text("Bank BCA - 1234567890 a/n PastryFity", 20, y+25);
            
            doc.save(`Invoice_${no}_${klien}.pdf`);
            logActivity('Generate Invoice', `Cetak Invoice B2B untuk ${klien}`);
        }

        // ==========================================

        function renderLegal() {
            const ws = document.getElementById('main-workspace');
            ws.innerHTML = `

                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6 border-b border-pink-100 pb-3">Sistem Generator Legal Dokumen Korporat</h3>

                            </select>
                        </div>
                        <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Pihak Kedua (Karyawan/Mitra)</label><input type="text" id="leg-nama" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-xs font-medium outline-none focus:border-pink-400"></div>
                        <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Posisi / Keterangan Jabatan</label><input type="text" id="leg-posisi" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-xs font-medium outline-none focus:border-pink-400"></div>
                        <button type="submit" class="btn-ios w-full py-4 bg-pink-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-pink-700">Cetak Dokumen Resmi (PDF A4)</button>
                    </form>
                </div>
            `;
        }

        function generateLegalPDF(e) {
            e.preventDefault();
            const tipe = document.getElementById('leg-tipe').value;
            const nama = document.getElementById('leg-nama').value;
            const pos = document.getElementById('leg-posisi').value;
            const d = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ format: 'a4' });
            
            doc.setFont("times", "bold"); doc.setFontSize(16); doc.text("PASTRYFITY ENTERPRISE", 105, 20, {align:"center"});
            doc.setFontSize(11); doc.text("Gedung PastryFity HQ, Jalan Merdeka No. 1, Kota Medan", 105, 25, {align:"center"});
            doc.line(20, 28, 190, 28); doc.setLineWidth(0.5); doc.line(20, 29, 190, 29);

            doc.setFont("times", "normal"); doc.setFontSize(11);
            let y = 45;

            if(tipe === 'PKWT') {
                doc.setFont("times", "bold"); doc.text("SURAT PERJANJIAN KERJA WAKTU TERTENTU (PKWT) & NDA", 105, 38, {align:"center"}); doc.setFont("times", "normal");
                doc.text(`Pada hari ini, tanggal ${d}, telah disepakati Perjanjian Kerja Waktu Tertentu `, 20, y); y+=6;
                doc.text(`antara PastryFity dan Saudara/i ${nama} (${pos}).`, 20, y); y+=10;
                doc.text("Pihak Kedua DILARANG KERAS menyebarluaskan, menduplikasikan, atau menggunakan informasi", 20, y); y+=6;
                doc.text("berupa Resep (BOM), prosedur baking, dan informasi sensitif milik PastryFity.", 20, y); y+=20;
            } 
            else if (tipe === 'SP') {
                doc.setFont("times", "bold"); doc.text("SURAT PERINGATAN KEDISIPLINAN", 105, 38, {align:"center"}); doc.setFont("times", "normal");
                doc.text(`Nomor: SP/PF/${new Date().getTime().toString().slice(-4)}/2026`, 20, y); y+=10;
                doc.text(`Surat ini ditujukan secara formal kepada Saudara/i ${nama} (${pos}).`, 20, y); y+=8;
                doc.text("Manajemen PastryFity menerbitkan Surat Peringatan ini berdasarkan temuan pelanggaran Standar", 20, y); y+=6;
                doc.text("Operasional Prosedur (SOP) perusahaan atau kelalaian kerja.", 20, y); y+=20;
            }
            else if (tipe === 'Paklaring') {
                doc.setFont("times", "bold"); doc.text("SURAT KETERANGAN PENGALAMAN KERJA (PAKLARING)", 105, 38, {align:"center"}); doc.setFont("times", "normal");
                doc.text("Dengan ini menerangkan bahwa:", 20, y); y+=10;
                doc.text(`Nama: ${nama}`, 20, y); y+=6;
                doc.text(`Jabatan Terakhir: ${pos}`, 20, y); y+=10;
                doc.text("Telah bekerja di PastryFity dengan baik dan kami mengucapkan terima kasih atas dedikasinya.", 20, y); y+=20;
            }
            else {
                // Generic fallback for SK, Mutasi, Kemitraan
                doc.setFont("times", "bold"); doc.text(`SURAT RESMI ${tipe.toUpperCase()}`, 105, 38, {align:"center"}); doc.setFont("times", "normal");
                doc.text(`Menerangkan bahwa Saudara/Mitra ${nama} yang berkedudukan di/sebagai ${pos}`, 20, y); y+=6;
                doc.text("terkait dengan operasional ekosistem PastryFity terhitung sejak surat ini diterbitkan.", 20, y); y+=20;
            }

            doc.text("Ditandatangani secara digital oleh sistem ERP PastryFity,", 20, y); y+=6;
            doc.text("Medan, " + d, 20, y); y+=20;
            doc.text("( Direktur Utama / HRD PastryFity )", 20, y);
            doc.save(`Dokumen_${tipe}_${nama}.pdf`);
        }

        // ==========================================
        // MODULE: MASTER CONTROL (ROLES & CHECKBOXES)
        // ==========================================
        function renderMaster() {
            const ws = document.getElementById('main-workspace');
            
            // Build Checboxes for Custom Role
            let cBoxHTML = '';
            for(let key in MODULES) {
                cBoxHTML += `<label class="flex items-center gap-2 text-[10px] text-slate-600"><input type="checkbox" class="cr-mod-check" value="${key}"> ${MODULES[key].label}</label>`;
            }

            ws.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white border border-pink-100 rounded-xl p-6 shadow-sm">
                        <h3 class="text-sm font-bold text-slate-800 uppercase mb-4 border-b border-pink-100 pb-2">Buat Akses & PIN Karyawan</h3>
                        <form onsubmit="saveUserPin(event)" class="space-y-3">
                            <input type="text" id="mu-nama" required placeholder="Nama Lengkap Karyawan" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-400">
                            <select id="mu-role" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-400">
                                <option value="Kasir">Kasir</option><option value="Baker">Baker / Kitchen</option><option value="Supervisor">Supervisor</option><option value="Finance">Finance</option>
                            </select>
                            <button type="submit" class="w-full py-2.5 bg-pink-500 text-white text-xs font-bold rounded-lg hover:bg-pink-600">Generate PIN</button>
                        </form>
                        <div class="mt-4 border-t border-pink-100 pt-4 overflow-y-auto max-h-48"><table class="w-full text-left text-xs"><tbody id="table-users-body" class="divide-y divide-pink-50"></tbody></table></div>
                    </div>

                    <div class="bg-white border border-pink-100 rounded-xl p-6 shadow-sm space-y-6">
                        <div>
                            <h3 class="text-sm font-bold text-slate-800 uppercase mb-2 border-b border-pink-100 pb-2">Manajemen Custom Role Baru</h3>
                            <p class="text-[10px] text-slate-500 mb-3">Tulis nama Role dan pilih (centang) akses modul dasbor yang diperbolehkan.</p>
                            <input type="text" id="cr-nama" placeholder="Nama Role (Cth: Admin Sosmed)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-pink-400 mb-2">
                            <div class="grid grid-cols-2 gap-2 p-3 border border-slate-100 rounded-lg bg-slate-50 mb-3">${cBoxHTML}</div>
                            <button onclick="saveRole()" class="w-full py-2 bg-slate-800 text-white text-[10px] font-bold rounded-lg hover:bg-slate-900">Tambah Role & Hak Akses</button>
                        </div>
                    </div>
                </div>
            `;
            loadUserPins();
            loadRoleOptions();
        }

        function saveUserPin(e) {
            e.preventDefault();
            const pin = Math.floor(100000 + Math.random() * 900000).toString();
            db.transaction('users','readwrite').objectStore('users').put({
                nama: document.getElementById('mu-nama').value, role: document.getElementById('mu-role').value, pin: pin
            }).onsuccess = () => { logActivity('PIN Center', `Generate PIN untuk ${document.getElementById('mu-nama').value}`); document.getElementById('mu-nama').value=''; loadUserPins(); };
        }
        function loadUserPins() {
            let tb = document.getElementById('table-users-body'); tb.innerHTML='';
            db.transaction('users','readonly').objectStore('users').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c) { tb.innerHTML += `<tr><td class="p-2 font-bold">${c.value.nama} <span class="block text-[9px] text-pink-400">${c.value.role}</span></td><td class="p-2 font-mono font-black text-pink-600">${c.value.pin}</td></tr>`; c.continue(); }
            }
        }
        function loadRoleOptions() {
            let sel = document.getElementById('mu-role'); if(!sel) return;
            sel.innerHTML = '';
            db.transaction('roles','readonly').objectStore('roles').openCursor().onsuccess = e => {
                let c = e.target.result;
                if(c){ sel.innerHTML += `<option value="${c.value.name}">${c.value.name}</option>`; c.continue(); }
            }
        }
        function saveRole() {
            let n = document.getElementById('cr-nama').value.trim(); if(!n) return alert('Nama Role harus diisi!');
            let checkedMods = [];
            document.querySelectorAll('.cr-mod-check:checked').forEach(el => checkedMods.push(el.value));
            if(checkedMods.length === 0) return alert('Pilih minimal 1 akses modul!');
            
            db.transaction('roles','readwrite').objectStore('roles').put({name: n, modules: checkedMods}).onsuccess = () => {
                logActivity('Role Management', `Menambah role ${n}`); document.getElementById('cr-nama').value=''; loadRoleOptions(); alert('Akses Role berhasil dibuat!'); renderMaster();
            }
        }

    </script>
